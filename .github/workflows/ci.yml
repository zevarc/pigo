name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bridge:
    name: bridge (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `engines` says >=22; 26 is what development happens on, so both ends of
        # the supported range are checked rather than just the minimum.
        node: ["22", "26"]
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: bridge/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  android:
    name: android (unit tests + debug apk)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      # JDK 17 is what compileOptions/jvmTarget pin. The runner's default JDK
      # changes over time, so this is stated rather than assumed.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The runner image ships a complete Android SDK, and setup-android@v3
      # fails on it: the action insists on installing the `tools` package, which
      # Google has since removed from the repository. Only the platform matching
      # compileSdk 37 is missing, so that is all we install.
      - name: Install SDK platform 37
        run: |
          # The runner image keeps the SDK at a fixed path but does not export
          # ANDROID_HOME to every step, so set it here rather than assume.
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1)
          echo "using $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;36.0.0"

          ls "$ANDROID_HOME/platforms"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle/libs.versions.toml', 'android/**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      # A release APK is smaller and has no debug instrumentation, but an
      # unsigned one cannot be installed at all. Decode the keystore only when
      # the secret exists, so forks and unconfigured clones still build.
      - name: Decode keystore
        id: keystore
        env:
          PIGO_KEYSTORE_BASE64: ${{ secrets.PIGO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$PIGO_KEYSTORE_BASE64" ]; then
            echo "No keystore secret; release build will be skipped."
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$PIGO_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pigo-release.jks"
          echo "PIGO_KEYSTORE_FILE=$RUNNER_TEMP/pigo-release.jks" >> "$GITHUB_ENV"
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Assemble signed release APK
        if: steps.keystore.outputs.present == 'true'
        env:
          PIGO_KEYSTORE_PASSWORD: ${{ secrets.PIGO_KEYSTORE_PASSWORD }}
          PIGO_KEY_ALIAS: ${{ secrets.PIGO_KEY_ALIAS }}
          PIGO_KEY_PASSWORD: ${{ secrets.PIGO_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify release signature
        if: steps.keystore.outputs.present == 'true'
        run: |
          # Catches the case where signing silently fell back to unsigned.
          apk="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$apk" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: android-test-report
          path: android/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        if: steps.keystore.outputs.present == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  release:
    name: attach APK to the release
    # Only on a version tag: push-to-main runs produce an artifact for testing,
    # a tag produces something you can hand to a phone permanently.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [bridge, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # The signed build is the one people actually install; fall back to debug
      # so a tag still produces something runnable when secrets are absent.
      - uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          name: app-release-apk
          path: dist-release

      - uses: actions/download-artifact@v5
        with:
          name: app-debug-apk
          path: dist-debug

      - name: Rename APK after the tag
        run: |
          tag="${GITHUB_REF_NAME}"
          mkdir -p dist
          if [ -n "$(ls dist-release/*.apk 2>/dev/null)" ]; then
            cp dist-release/*.apk "dist/pigo-${tag}.apk"
            echo "packaging signed release APK"
          else
            cp dist-debug/*.apk "dist/pigo-${tag}-debug.apk"
            echo "::warning::no signed release APK (secrets missing); attaching debug build"
          fi
          ls -l dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
